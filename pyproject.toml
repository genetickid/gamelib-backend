[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gamelib"
version = "0.0.1"
dependencies = [
  "fastapi>=0.130.0",
  "uvicorn>=0.49.0",
  "sqlalchemy>=2.0.51",
  "pydantic>=2.13.0",
  "alembic>=1.18.4",
  "aiosqlite>=0.22.1",
  "asyncpg>=0.31.0",
  "psycopg[binary]",
  "python-multipart>=0.0.32",
  "pwdlib[argon2]",
  "pyjwt",
  "pydantic-settings",
  "pytest-asyncio"
]

[project.optional-dependencies]
test = ["pytest", "httpx", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
